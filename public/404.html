<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina nu a fost găsită | FXF Web Hosting</title>
  <meta name="description" content="Pagina pe care o căutați nu a fost găsită. Reveniți la pagina principală FXF Web Hosting.">
  <link rel="icon" href="/favicon.ico">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0f2847 50%, #0a1628 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: 0.875rem;
      font-weight: bold;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }
    .logo-text span:first-child {
      font-weight: bold;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
    .logo-text span:last-child {
      font-size: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }
    .error-code {
      font-size: 8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #22d3ee 0%, #0ea5e9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      color: rgba(255,255,255,0.6);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #22d3ee 0%, #0ea5e9 100%);
      color: #0a1628;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(34, 211, 238, 0.3);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
    }
    .links {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .links p {
      font-size: 0.75rem;
      margin-bottom: 1rem;
    }
    .links a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-size: 0.75rem;
      margin: 0 0.5rem;
      transition: color 0.2s;
    }
    .links a:hover {
      color: #22d3ee;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">&lt;/&gt;</div>
      <div class="logo-text">
        <span>FXF WEB</span>
        <span>HOSTING</span>
      </div>
    </div>
    
    <div class="error-code">404</div>
    
    <h1>Pagina nu a fost găsită</h1>
    <p>Ne pare rău, pagina pe care o căutați nu există sau a fost mutată. Verificați adresa URL sau reveniți la pagina principală.</p>
    
    <div class="buttons">
      <a href="/" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Pagina Principală
      </a>
      <a href="/contact" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        Contact
      </a>
    </div>
    
    <div class="links">
      <p>Sau încearcă una din paginile noastre:</p>
      <a href="/gazduire/web">Găzduire Web</a>
      <a href="/gazduire/wordpress">WordPress</a>
      <a href="/servere/vps">VPS</a>
      <a href="/servere/dedicat">Servere Dedicate</a>
    </div>
  </div>
</body>
</html>
